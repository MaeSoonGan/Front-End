name: Build and Push Frontend Image to ECR

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "src/**"
      - "public/**"
      - "k8s/**"
      - "Dockerfile"
      - "nginx.conf"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig*.json"
      - ".github/workflows/build-and-push-ecr.yml"
  workflow_dispatch:

concurrency:
  group: build-and-push-frontend-ecr-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: write

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  USER_IMAGE_NAME: maesoongan/frontend-user
  ADMIN_IMAGE_NAME: maesoongan/frontend-admin
  DEPLOYMENT_MANIFEST: k8s/frontend-deployment.yaml

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL= \
            -t maesoongan-frontend:${{ github.sha }} \
            .
          docker tag maesoongan-frontend:${{ github.sha }} $ECR_REGISTRY/$USER_IMAGE_NAME:${{ github.sha }}
          docker tag maesoongan-frontend:${{ github.sha }} $ECR_REGISTRY/$USER_IMAGE_NAME:latest
          docker tag maesoongan-frontend:${{ github.sha }} $ECR_REGISTRY/$ADMIN_IMAGE_NAME:${{ github.sha }}
          docker tag maesoongan-frontend:${{ github.sha }} $ECR_REGISTRY/$ADMIN_IMAGE_NAME:latest

      - name: Push Docker image
        run: |
          docker push $ECR_REGISTRY/$USER_IMAGE_NAME:${{ github.sha }}
          docker push $ECR_REGISTRY/$USER_IMAGE_NAME:latest
          docker push $ECR_REGISTRY/$ADMIN_IMAGE_NAME:${{ github.sha }}
          docker push $ECR_REGISTRY/$ADMIN_IMAGE_NAME:latest

  update-k8s-image-tag:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Update Kubernetes image tag
        run: |
          set -euo pipefail

          user_image="$ECR_REGISTRY/$USER_IMAGE_NAME:${GITHUB_SHA}"
          admin_image="$ECR_REGISTRY/$ADMIN_IMAGE_NAME:${GITHUB_SHA}"

          sed -i -E "s#image: .*maesoongan/frontend-user:[^[:space:]]+#image: ${user_image}#" "$DEPLOYMENT_MANIFEST"
          sed -i -E "s#image: <ECR_USER_IMAGE_URI>:<TAG>#image: ${user_image}#" "$DEPLOYMENT_MANIFEST"
          sed -i -E "s#image: .*maesoongan/frontend-admin:[^[:space:]]+#image: ${admin_image}#" "$DEPLOYMENT_MANIFEST"
          sed -i -E "s#image: <ECR_ADMIN_IMAGE_URI>:<TAG>#image: ${admin_image}#" "$DEPLOYMENT_MANIFEST"

          echo "Updated user image -> $user_image"
          echo "Updated admin image -> $admin_image"

      - name: Commit Kubernetes image tag update
        run: |
          set -euo pipefail

          if git diff --quiet -- "$DEPLOYMENT_MANIFEST"; then
            echo "No Kubernetes image tag changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$DEPLOYMENT_MANIFEST"
          git commit -m "CHORE: update frontend image tag to ${GITHUB_SHA}"
          git push origin HEAD:${GITHUB_REF_NAME}
