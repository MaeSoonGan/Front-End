apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-ingress
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    # TODO: 기존 ALB/Ingress 그룹명, 인증서 ARN, SSL redirect annotation을 실제 환경 값으로 맞춥니다.
spec:
  rules:
    - host: www.maesoongan.xyz
      http:
        paths:
          # IMPORTANT:
          # /api/... and /api/admin/... must be routed to backend services by higher-priority ALB rules.
          # /admin is routed to the admin frontend pods, and the remaining SPA routes go to user frontend pods.
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: frontend-admin-service
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-user-service
                port:
                  number: 80
