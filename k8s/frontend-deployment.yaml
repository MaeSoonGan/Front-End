apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-user
  labels:
    app: frontend-user
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend-user
  template:
    metadata:
      labels:
        app: frontend-user
    spec:
      nodeSelector:
        eks.amazonaws.com/nodegroup: maesoongan-nodegroup-frontend
      containers:
        - name: frontend-user
          # TODO: GitHub Actions가 실제 ECR 이미지 URI와 태그로 교체합니다.
          image: <ECR_USER_IMAGE_URI>:<TAG>
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
