apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-user
  namespace: app
  labels:
    app: frontend-user
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend-user
  template:
    metadata:
      labels:
        app: frontend-user
    spec:
      nodeSelector:
        eks.amazonaws.com/nodegroup: maesoongan-nodegroup-frontend
      containers:
        - name: frontend-user
          image: 295234319852.dkr.ecr.ap-northeast-2.amazonaws.com/maesoongan/frontend-user:344003c4e0b4d1b07fa2c32880785aaaa8fc4105
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
---
